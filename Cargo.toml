[package]
name = "lexio-rent"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Async client for the Lexio Rent API (car rental software): fleet, rentals, quotes, customers, payments and maintenance."
license = "MIT"
homepage = "https://lexio.rent/logiciel-location-voiture"
repository = "https://github.com/lexio-rent-git/lexio-rust"
documentation = "https://docs.rs/lexio-rent"
readme = "README.md"
keywords = ["lexio", "car-rental", "fleet", "api-client", "openapi"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["src/**", "examples/**", "tests/**", "scripts/**", "spec/**", "Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md"]

[lib]
name = "lexio_rent"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
